name: Build APK

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: 'Server Name'
        required: true
      api_link:
        description: 'Gist JSON URL'
        required: true
      chat_id:
        description: 'Telegram Chat ID'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O signer.jar

      - name: Decompile base APK
        run: apktool d base.apk -o decoded

      - name: Patch URL in smali and xml
        run: |
          find decoded -type f \( -name "*.smali" -o -name "*.xml" \) -exec sed -i "s|https://www.dropbox.com/scl/fi/shml167nf1vjgxhjldgsy/servers-Sotka.json?rlkey=wcxobzpsoz8l8pckkykj2c7nt&st=jx2tys0c&dl=1|${{ github.event.inputs.api_link }}|g" {} +

      - name: Rebuild APK
        run: apktool b decoded -o unsigned.apk

      - name: Sign APK
        run: java -jar signer.jar -a unsigned.apk --out final_dir

      - name: Send to TG
        run: |
          APK_PATH=$(ls final_dir/*.apk | head -n 1)
          curl -F "chat_id=${{ github.event.inputs.chat_id }}" -F document=@$APK_PATH https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendDocument
